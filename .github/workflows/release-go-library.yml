name: release-go-library

# Reusable release workflow for tdrn-org Go libraries.
#
# It tags only when nothing but dependencies changed since the last tag:
# go.mod/go.sum present, no .go file touched, no tdrn-org module raised,
# no minor bump of the go directive, and the next patch version still free.
# "The build is green" is guaranteed by the caller — it runs this workflow on a
# successful build.
#
# Callers REFERENCE this file, they do not copy it:
#
#   jobs:
#     release:
#       uses: tdrn-org/.github/.github/workflows/release-go-library.yml@main
#       with:
#         sha: ${{ github.event.workflow_run.head_sha }}
#         dry-run: true     # keep true until it has run once as expected
on:
  workflow_call:
    inputs:
      sha:
        description: 'Commit to release (defaults to the caller''s HEAD)'
        required: false
        type: string
      dry-run:
        description: 'true = evaluate and report only, never tag'
        required: false
        type: boolean
        default: true

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create tag + release (effective only when dry-run is false)
    steps:
      - name: Checkout (full history, tags included)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.sha || github.sha }}

      - name: Evaluate release gate
        id: gate
        env:
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -uo pipefail
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

          tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo "")
          if [ -z "$tag" ]; then
            echo "reason=no tag in this repository" >> "$GITHUB_OUTPUT"
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "last tag: $tag"

          files=$(git diff --name-only "$tag..HEAD")
          if [ -z "$files" ]; then
            echo "reason=nothing changed since $tag" >> "$GITHUB_OUTPUT"
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          code=$(printf '%s\n' "$files" | grep -c '\.go$')
          dep=$(printf '%s\n' "$files" | grep -c '^go\.\(mod\|sum\)$')
          internal=$(git diff "$tag..HEAD" -- go.mod | grep -c '^[+-].*tdrn-org/')

          old_go=$(git show "$tag:go.mod" 2>/dev/null | grep -m1 '^go ' | tr -d ' ' || echo "")
          new_go=$(grep -m1 '^go ' go.mod | tr -d ' ' || echo "")
          old_ver="${old_go#go}"; new_ver="${new_go#go}"
          # "go 1.26" and "go 1.26.0" are the same requirement — normalise to three parts
          case "$old_ver" in *.*.*) ;; *) old_ver="$old_ver.0" ;; esac
          case "$new_ver" in *.*.*) ;; *) new_ver="$new_ver.0" ;; esac
          if [ "$old_ver" = "$new_ver" ]; then floor="ok"
          elif [ "${old_ver%.*}" = "${new_ver%.*}" ]; then floor="patch"   # same minor: harmless
          else floor="MINOR"; fi                                          # pulls the fleet up

          echo "code=$code dep=$dep internal=$internal floor=$floor"
          echo "reason=code=$code dep=$dep internal=$internal floor=$floor" >> "$GITHUB_OUTPUT"

          if [ "$code" != "0" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "STOP: source changed since $tag"; exit 0
          fi
          if [ "$internal" != "0" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "STOP: internal tdrn-org module raised"; exit 0
          fi
          if [ "$floor" = "MINOR" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "STOP: go directive jumps a minor version"; exit 0
          fi
          if [ "$dep" = "0" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "nothing to release: docs/workflow only"; exit 0
          fi

          base="${tag#v}"; IFS=. read -r major minor patch <<< "$base"
          next="v${major}.${minor}.$((patch + 1))"
          if git rev-parse -q --verify "refs/tags/$next" >/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "tag $next already exists"; exit 0
          fi

          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "next version would be $next (dry-run=$DRY_RUN)"

      - name: Create release
        if: steps.gate.outputs.skip == 'false' && inputs.dry-run == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          sha='${{ steps.gate.outputs.sha }}'
          tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*')
          next='${{ steps.gate.outputs.next }}'
          {
            echo "**Dependency updates only** — no source changes."
            echo
            echo '```diff'
            git diff "$tag..HEAD" -- go.mod go.sum | grep '^[+-]' | grep -v '^[+-][+-][+-]' || true
            echo '```'
            echo
            echo "Verified green by the \`build\` workflow on \`${sha:0:7}\`."
          } > notes.md
          gh release create "$next" --target "$sha" --title "$next" --notes-file notes.md

      - name: Write job summary
        run: |
          {
            echo "### Release gate"
            echo "- commit: \`${{ steps.gate.outputs.sha }}\`"
            echo "- result: ${{ steps.gate.outputs.reason }}"
            echo "- next version: \`${{ steps.gate.outputs.next }}\`"
            echo "- tagged: \`${{ steps.gate.outputs.skip == 'false' && inputs.dry-run == false }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
